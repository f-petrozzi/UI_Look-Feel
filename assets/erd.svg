<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" preserveAspectRatio="xMidYMid meet">
  <!-- SVG wrapper that embeds the raster PNG (erd.png) inside an SVG as a data reference to the file in the same folder. This keeps the visual PNG but makes the file import as .svg. -->
  <rect width="100%" height="100%" fill="#0f0f10"/>
  <image href="erd.png" x="0" y="0" width="1000" height="800" preserveAspectRatio="xMidYMid meet" />
</svg>