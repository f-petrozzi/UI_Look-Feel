    <text class="t" x="12" y="22">Enrollments</text>
    <text class="t pk" x="12" y="60">EnrollmentID (PK)</text>
    <text class="t fk" x="12" y="84">StudentID (FK)</text>
    <text class="t fk" x="12" y="108">ProgramID (FK)</text>
    <text class="t fk" x="12" y="132">TermID (FK)</text>
    <text class="t" x="12" y="156">EnrollmentDate</text>
  </g>
  <line class="line" x1="210" y1="180" x2="210" y2="210"/>
  <line class="line" x1="450" y1="180" x2="450" y2="210"/>
  <line class="line" x1="750" y1="180" x2="750" y2="210"/>
