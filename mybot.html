<!-- mybot.html -->

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EduInsight — Ask EduBot</title>

  <!-- Your site CSS -->
  <link rel="stylesheet" href="style.css" />

  <!-- (Optional) charts you had before; safe to keep -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>

  <!-- Botpress WebChat loader (v3.3) -->
  <script src="https://cdn.botpress.cloud/webchat/v3.3/inject.js"></script>

  <!-- Make the widget fill its container and hide the floating FAB -->
  <style>
    /* Card that will hold the embedded chat */
    .chat-card { padding: 0; overflow: hidden; }

    /* Botpress recommended overrides */
    #webchat .bpWebchat {
      position: unset;
      width: 100%;
      height: 100%;
      max-height: 100%;
      max-width: 100%;
    }
    #webchat .bpFab { display: none; }

    /* Responsive height for the embedded div */
    @media (max-width: 768px) {
      #webchat { height: 75vh !important; }
    }
  </style>
</head>
<body>
  <!-- header -->
  <header class="site-header">
    <div class="container navbar">
      <div class="logo">
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect x="2" y="2" width="28" height="28" rx="8" stroke="url(#g)" stroke-width="2"/>
          <path d="M9 17l5 5 9-12" stroke="url(#g)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="32" y2="32">
              <stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#22c55e"/>
            </linearGradient>
          </defs>
        </svg>
        <span>EduInsight</span>
      </div>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="data.html">Data visualization</a>
        <a href="about.html">About</a>
        <a class="active" href="mybot.html">Ask EduBot</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <!-- intro -->
    <section class="card">
      <h1 class="h1">Ask EduBot</h1>
      <p class="subtitle">This assistant answers questions about our enrollment dataset.</p>
      <p>You can chat below. The widget is embedded directly into this page.</p>
    </section>

    <!-- Embedded Botpress WebChat -->
    <section class="card chat-card">
      <!-- Place BEFORE the init script -->
      <div id="webchat" style="width: 100%; height: 640px;"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p class="muted">© 2025 EduInsight. For academic demonstration.</p>
    </div>
  </footer>

  <!-- Botpress init (uses your provided configuration + stylesheet URL) -->
  <script>
    // Open automatically when the webchat is ready
    window.botpress.on("webchat:ready", () => {
      try { window.botpress.open(); } catch (e) {}
    });

    window.botpress.init({
      "botId": "7acd5367-9b96-4afb-a37b-2e996c792b7c",
      "configuration": {
        "version": "v2",
        "botName": "EduBot",
        "website": {},
        "email": {},
        "phone": {},
        "termsOfService": {},
        "privacyPolicy": {},
        "color": "#46a758",
        "variant": "solid",
        "headerVariant": "glass",
        "themeMode": "light",
        "fontFamily": "inter",
        "radius": 4,
        "feedbackEnabled": false,
        "footer": "[⚡ by Botpress](https://botpress.com/?from=webchat)",
        "additionalStylesheetUrl": "https://files.bpcontent.cloud/2025/10/18/18/20251018182845-0UGGG7FK.css",
        "soundEnabled": false,
        "proactiveMessageEnabled": false,
        "proactiveBubbleMessage": "Hi! 👋 Need help?",
        "proactiveBubbleTriggerType": "afterDelay",
        "proactiveBubbleDelayTime": 10
      },
      "clientId": "9bf9fe65-41fb-48bd-a75d-d8ea153de37c",
      "selector": "#webchat"
    });
  </script>

  <noscript><p style="padding:1rem">Chat requires JavaScript. Please enable it to use EduBot.</p></noscript>
</body>
</html>
