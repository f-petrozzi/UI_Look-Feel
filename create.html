<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EduInsight</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
</head>
<body>
  <!-- header -->
  <header class="site-header">
    <div class="container navbar">
      <div class="logo">
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="2" width="28" height="28" rx="8" stroke="url(#g)" stroke-width="2"/>
          <path d="M9 17l5 5 9-12" stroke="url(#g)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="32" y2="32">
              <stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#22c55e"/>
            </linearGradient>
          </defs>
        </svg>
        <span>EduInsight</span>
      </div>
      <nav class="nav">
        <a class="" href="index.html">Home</a>
        <a class="" href="data.html">Data visualization</a>
        <a class="" href="about.html">About</a>
        <a class="" href="mybot.html">Ask EduBot</a>
      </nav>
    </div>
  </header>
  <main class="container">

  <!-- crud tabs -->
  <nav class="crud-nav">
    <a href="read.html">View enrollments</a>
    <a class="active" href="create.html">Add enrollment</a>
    <a href="update.html">Update enrollment</a>
    <a href="delete.html">Delete enrollment</a>
  </nav>

  <!-- form -->
  <section class="card">
    <h1 class="h1">Add enrollment</h1>
    <p class="subtitle">Capture a new student enrollment.</p>
    <form onsubmit="event.preventDefault()">
      <div class="grid cols-2">
        <div><label>Student ID</label><input class="input" required placeholder="e.g., 1001"></div>
        <div><label>Student name</label><input class="input" required placeholder="e.g., A. Student"></div>
        <div><label>Program</label>
          <select required>
            <option>Data Science MS</option>
            <option>Analytics MBA</option>
            <option>Cybersecurity MS</option>
            <option>EdTech MS</option>
          </select>
        </div>
        <div><label>Term</label>
          <select required>
            <option>Spring 2025</option>
            <option>Summer 2025</option>
            <option>Fall 2025</option>
          </select>
        </div>
        <div><label>GPA</label><input class="input" type="number" step="0.01" min="0" max="4" required placeholder="e.g., 3.75"></div>
        <div><label>Enrollment date</label><input class="input" type="date" required></div>
      </div>
      <div style="margin-top:12px"><button class="btn primary" type="submit">Save</button></div>
    </form>
  </section>

  </main>
  <footer class="site-footer">
    <div class="container">
      <p class="muted">© 2025 EduInsight. For academic demonstration.</p>
    </div>
  </footer>
</body>
</html>
